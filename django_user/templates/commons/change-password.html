{% extends 'base.html' %}

{% block title %}Change Password{% endblock title %}

{% block content %} 
    <div class="container w-50" style="font-size: 13px">
    <h2 style= "color: green; font-weight: bolder;">Change Password</h2>
    <br>
    <form method="post">
        {% csrf_token %}
        <div class="form-group align-items-center" style= "color: red">
            {{ form.as_p }}
        </div>
        <a href="{% url 'home' %}" class="btn btn-primary"> Back </a>
        <button type="submit" class="btn btn-success">Submit</button>
        
    </form>
</div>
{% endblock %}
{% block mainbody %} {% endblock %}
